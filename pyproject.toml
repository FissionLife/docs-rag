[project]
name = "docs-rag"
version = "0.1.0"
description = "A strictly grounded RAG pipeline over documents you choose"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.18.0",
    "numpy>=2.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.0",
    "trafilatura>=2.2.0",
]

# These become `uv run <name>`. uv has no npm-style script table; console
# entry points are the idiomatic equivalent, and uv installs the project
# automatically before running one.
[project.scripts]
help = "rag.cli:main"
# build the corpus
add = "rag.cli:add"
ingest = "rag.cli:ingest"
remove = "rag.cli:remove"
clear = "rag.cli:clear"
# inspect it
list = "rag.cli:list_docs"
status = "rag.cli:status"
inspect = "rag.cli:inspect"
# ask it things
dev = "rag.cli:dev"
ask = "rag.cli:ask"
eval = "rag.cli:evaluate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
